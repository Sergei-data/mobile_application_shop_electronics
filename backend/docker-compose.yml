
# docker compose up -d
# docker compose exec api alembic upgrade head
# docker compose --profile manual run --rm seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./seed/images:/seed/images:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/product-images || true;
      mc anonymous set download local/product-images || true;
      mc mirror --overwrite /seed/images local/product-images;
      echo 'MinIO seed done';
      "

  api:
    build: .
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: "amqp://shop:shop@rabbitmq:5672/"
      RABBITMQ_EXCHANGE_NAME: "shop.events"
      RABBITMQ_ORDER_CREATED_QUEUE: "order.created.queue"
      RABBITMQ_ORDER_CREATED_ROUTING_KEY: "order.created"
      KEYCLOAK_REALM: "shop"
      JWT_AUDIENCE: ""
      KEYCLOAK_INTERNAL_BASE_URL: "http://keycloak:8080"
      KEYCLOAK_ISSUER_URLS: '["http://10.0.2.2:8080/realms/shop","http://localhost:8080/realms/shop"]'
      PUBLIC_S3_BASE: "http://10.0.2.2:9000"
      S3_BUCKET: "product-images"
      TZ: "Europe/Berlin"
      DATABASE_URL: "postgresql+asyncpg://shop:shop@db:5432/shop"
      S3_PUBLIC_BASE_URL: "http://10.0.2.2:9000"
      S3_BUCKET_NAME: "product-images"
      ENV: "dev"
      SEED_ON_STARTUP: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    

  seed:
    build: .
    volumes:
      - ./:/app
    profiles: ["manual"]
    environment:
      PUBLIC_S3_BASE: "http://10.0.2.2:9000"
      S3_BUCKET: "product-images"
      TZ: "Europe/Berlin"
      DATABASE_URL: "postgresql+asyncpg://shop:shop@db:5432/shop"
      S3_PUBLIC_BASE_URL: "http://10.0.2.2:9000"
      S3_BUCKET_NAME: "product-images"
      ENV: "dev"
    depends_on:
      db:
        condition: service_healthy
    command: python -m seed.seed_run



  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "25432:5432"
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --http-port=8080 --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 30


  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.6
    environment:
      DOCKER_API_VERSION: "1.52"
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    privileged: true
    ports:
      - "8082:8080"
    command:
      - --docker_only=true
      - --store_container_labels=true
      - --docker=unix:///var/run/docker.sock
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:11.1.5
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus


  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20


  order-worker:
    build: .
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: "postgresql+asyncpg://shop:shop@db:5432/shop"
      RABBITMQ_URL: "amqp://shop:shop@rabbitmq:5672/"
      RABBITMQ_EXCHANGE_NAME: "shop.events"
      RABBITMQ_ORDER_CREATED_QUEUE: "order.created.queue"
      RABBITMQ_ORDER_CREATED_ROUTING_KEY: "order.created"
      ENV: "dev"
      TZ: "Europe/Berlin"
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    command: python -m app.workers.order_created_worker

volumes:
  pgdata:
  minio_data:
  keycloak_pgdata:
  loki_data:
  grafana_data:
  prom_data:
